name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Gradle project
        id: find_gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Gradle project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission
        working-directory: ${{ steps.find_gradle.outputs.project_dir }}
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ${{ steps.find_gradle.outputs.project_dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aria-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"