name: Build AI Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify HTML app
        run: |
          test -f index.html
          echo "AI Studio HTML found"

      - name: Package app
        run: |
          mkdir -p dist
          cp index.html dist/
          cp README.md dist/ 2>/dev/null || true
          cd dist
          zip -r ../AI-Studio-Personal.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Personal
          path: AI-Studio-Personal.zip