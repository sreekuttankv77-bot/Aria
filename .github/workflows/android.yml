name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          zips=( *.zip )

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No project ZIP found; assuming project is already extracted."
            exit 0
          fi

          ZIP="${zips[0]}"
          echo "Using project archive: $ZIP"

          rm -rf .project_extract
          mkdir .project_extract
          unzip -q "$ZIP" -d .project_extract

          ROOT=".project_extract"
          entries=(.project_extract/*)

          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            ROOT="${entries[0]}"
          fi

          cp -a "$ROOT"/. .
          rm -rf .project_extract

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle

          echo "Gradle project found:"
          ls -la
          find app -maxdepth 2 -type f | head -30

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found."
            echo "Installing Gradle 8.10.2..."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aria-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error