name: Build Monaco Mini GP APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Android project
        run: |
          find . -name gradlew -type f -print
          find . -name build.gradle.kts -type f -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name gradlew -type f | head -1)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Monaco-Mini-GP-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error