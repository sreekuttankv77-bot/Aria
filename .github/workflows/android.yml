name: Build Monaco Mini GP APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show repository files
        run: |
          echo "Repository:"
          pwd
          echo "Files:"
          find . -maxdepth 4 -type f | sort | head -300

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find . \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle project found."
            echo "Expected settings.gradle.kts or settings.gradle."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Found Android project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Monaco-Mini-GP-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error