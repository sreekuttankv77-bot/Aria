name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p project
          shopt -s nullglob
          zips=( *.zip )

          if [ ${#zips[@]} -eq 0 ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          unzip -o "${zips[0]}" -d project

      - name: Find Android project
        id: find
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "Android project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error