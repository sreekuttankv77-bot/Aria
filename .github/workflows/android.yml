name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP projects
        shell: bash
        run: |
          shopt -s nullglob
          for file in *.zip; do
            echo "Extracting $file"
            unzip -o "$file" -d extracted
          done

      - name: Find Android project
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew -not -path './.git/*' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort | head -n 300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Found Gradle wrapper: $GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk